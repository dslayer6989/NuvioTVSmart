name: Live TV Patch Generator (one-off)

# TEMPORARY one-off workflow. Applies two small surgical edits to
# .github/livetv-tools/livetv_smarttv.py in-place on the runner, verifies them,
# then commits and pushes to `dev`. Delete this file once it has run.
#
# WHY THIS EXISTS: the generator is ~104 KB. Passing a body that large through
# the GitHub contents API has destroyed the file three times (a placeholder was
# sent instead of the real body, and create_or_update_file replaces the whole
# file). This workflow never transports the body anywhere — it reads the file
# from the checked-out working tree, applies two literal string replacements,
# and pushes. No blob crosses a tool boundary.
#
# NOTE ON THE :is( GUARD: the generator's embedded liveTvScreen.js body contains
# a COMMENT that mentions ":is()" while warning against it. A blanket grep for
# ":is(" therefore false-positives. The guard below matches the actual constant
# assignment only.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: livetv-patch-generator
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot pre-edit state
        run: |
          set -euo pipefail
          TARGET=".github/livetv-tools/livetv_smarttv.py"
          echo "PRE_SHA=$(sha256sum "$TARGET" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "PRE_SIZE=$(wc -c < "$TARGET")" >> "$GITHUB_ENV"
          echo "pre size: $(wc -c < "$TARGET") bytes"

      - name: Apply the two edits
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          from pathlib import Path
          import sys

          target = Path(".github/livetv-tools/livetv_smarttv.py")
          src = target.read_text(encoding="utf-8")
          original = src

          # ------------------------------------------------------------------
          # EDIT 1 — append the CW skeleton-predicate tuple to SURGICAL_EDITS.
          # ------------------------------------------------------------------
          new_tuple = (
              "    (\n"
              "        \"js/ui/screens/home/homeScreenHelpers-15-create-poster-card-markup.js\",\n"
              "        \"  const isLoading = Boolean(item?.isLoading);\\n\",\n"
              "        \"  const isLoading =\\n\"\n"
              "        \"    Boolean(item?.isLoading) &&\\n\"\n"
              "        \"    !item?.poster &&\\n\"\n"
              "        \"    !item?.backdrop &&\\n\"\n"
              "        \"    !item?.background &&\\n\"\n"
              "        \"    !item?.thumbnail;\\n\",\n"
              "    ),\n"
          )

          if "!item?.thumbnail" in src:
              print("EDIT 1 already applied (found !item?.thumbnail) — skipping")
          else:
              marker = "SURGICAL_EDITS: list[tuple[str, str, str]] = ["
              mpos = src.find(marker)
              if mpos == -1:
                  print("ERROR: SURGICAL_EDITS declaration not found", file=sys.stderr)
                  sys.exit(1)
              close = src.find("\n]", mpos)
              if close == -1:
                  print("ERROR: SURGICAL_EDITS closing bracket not found", file=sys.stderr)
                  sys.exit(1)
              src = src[:close + 1] + new_tuple + src[close + 1:]
              print("EDIT 1 applied: appended CW predicate tuple")

          # ------------------------------------------------------------------
          # EDIT 2 — flip liveTv: false -> liveTv: true inside the expanded-
          # state tuple's REPLACEMENT only.
          # ------------------------------------------------------------------
          target_path = "js/ui/screens/settings/settingsScreenHelpers-10-create-default-expanded-state.js"
          tpos = src.find('"' + target_path + '"')
          if tpos == -1:
              print(f"ERROR: tuple for {target_path} not found", file=sys.stderr)
              sys.exit(1)

          needle = 'liveTv: false'
          npos = src.find(needle, tpos)
          if npos == -1:
              print("EDIT 2 already applied or not found after tuple start — skipping")
          else:
              src = src[:npos] + 'liveTv: true' + src[npos + len(needle):]
              print("EDIT 2 applied: liveTv: false -> liveTv: true")

          if src == original:
              print("NO CHANGES MADE — both edits were already present")
              Path("/tmp/nochange").write_text("1")
          else:
              target.write_text(src, encoding="utf-8")
              print(f"wrote {len(src)} chars")
          PYEOF

      - name: Verify the edits and file integrity
        run: |
          set -euo pipefail
          TARGET=".github/livetv-tools/livetv_smarttv.py"

          SIZE=$(wc -c < "$TARGET")
          echo "post size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::generator is only $SIZE bytes — it was truncated or destroyed"
            exit 1
          fi

          python3 -m py_compile "$TARGET"
          echo "py_compile OK"

          grep -q '!item?.thumbnail' "$TARGET" || { echo "::error::EDIT 1 missing (!item?.thumbnail)"; exit 1; }
          echo "EDIT 1 verified: !item?.thumbnail present"

          grep -q 'liveTv: true' "$TARGET" || { echo "::error::EDIT 2 missing (liveTv: true)"; exit 1; }
          echo "EDIT 2 verified: liveTv: true present"

          grep -q '\.livetv-focusable' "$TARGET" || { echo "::error::Batch A fix missing (.livetv-focusable)"; exit 1; }
          echo "Batch A verified: .livetv-focusable present"

          # Scoped guard: match the actual constant assignment only. A blanket
          # grep for ":is(" false-positives on the embedded comment in
          # liveTvScreen.js that WARNS against using :is().
          if grep -q 'FOCUS_SELECTOR = ":is(' "$TARGET"; then
            echo "::error::Batch A regression: FOCUS_SELECTOR is assigned a :is() selector"
            exit 1
          fi
          echo "Batch A verified: FOCUS_SELECTOR has no :is()"

          grep -q 'FOCUS_SELECTOR = "\.livetv-focusable"' "$TARGET" || { echo "::error::Batch A fix missing (FOCUS_SELECTOR = .livetv-focusable)"; exit 1; }
          echo "Batch A verified: FOCUS_SELECTOR = .livetv-focusable"

          grep -q -- '--nuvio-surface: #1a1a1a' "$TARGET" || { echo "::error::Batch A fix missing (default :root token)"; exit 1; }
          echo "Batch A verified: default :root token present"

          echo "POST_SHA=$(sha256sum "$TARGET" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          set -euo pipefail
          if [ -f /tmp/nochange ]; then
            echo "No changes to commit — both edits were already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/livetv-tools/livetv_smarttv.py
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          # Rebase onto origin/dev immediately before pushing; another writer may
          # have landed while this job was running.
          git fetch origin dev
          git rebase origin/dev || { echo "::error::rebase failed"; exit 1; }
          git commit -m "fix(livetv): cw skeleton predicate and expand live tv settings row [skip ci]"
          git push origin HEAD:dev

      - name: Summary
        run: |
          echo "### Live TV patch generator" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| item | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| pre sha256 | \`$PRE_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| post sha256 | \`$POST_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| pre size | $PRE_SIZE bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Delete \`.github/workflows/livetv-patch-generator.yml\` once confirmed." >> "$GITHUB_STEP_SUMMARY"
